<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Viewer</title>
  <!-- 本地引入 -->

    {
      "imports": {
        "marked": "./libs/marked/marked.esm.js",

  <!-- CDN 引入 -->
  <script type="importmap">
    {
      "imports": {
        "marked": "https://unpkg.com/marked@^17?module",
        "marked-gfm-heading-id": "https://unpkg.com/marked-gfm-heading-id@^4?module",
        "highlight.js": "https://unpkg.com/@highlightjs/cdn-assets@^11/es/highlight.min.js"
      }
    }
  </script>
  <!-- highlight.js vscode theme 可替换其他 highlight.js 主题样式 -->
  <link rel="stylesheet" href="./libs/xkk1/css/xkk1-highlightjs-vscode-theme.css">
  <!-- xkk1 主题 可替换 -->
  <link rel="stylesheet" href="./libs/xkk1/css/xkk1.css">
  <!-- 加载并渲染动态内容，必须 -->
  <script type="module" src="./main.js"></script>
</head>

<body>
  <main class="main">
    <div id="markdown" class="markdown"></div>
  </main>
  <!-- 右侧按钮 -->
  <div id="nav-right-buttons">

    <div id="back-to-top-button"></div>
    <!-- 深色、浅色模式切换 -->
    <div id="theme-toggle-button"></div>
  </div>
</body>

</html>
